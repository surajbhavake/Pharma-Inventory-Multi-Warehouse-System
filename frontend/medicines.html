
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Medicines </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Styles -->
    <link
        rel="stylesheet"
        href="./css/styles.css"
    >

</head>

<body class="bg-light">

<!-- SIDEBAR -->
<div id="sidebar-container"></div>


<!-- MAIN CONTENT -->
<div class="main-content p-4">

    <!-- HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="fw-bold">
                Medicines
            </h1>

            <p class="text-muted mb-0">
                Manage all medicines
            </p>

        </div>

        <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#medicineModal"
            onclick="resetForm()"
        >
            <i class="bi bi-plus-circle"></i>
            Add Medicine
        </button>

    </div>


    <!-- SEARCH -->
    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Search medicines by name..."
            >

        </div>

    </div>


    <!-- TABLE -->
    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>Name</th>
                            <th>Generic</th>
                            <th>Manufacturer</th>
                            <th>Strength</th>
                            <th>Category</th>
                            <th>Storage</th>
                            <th width="180">Actions</th>

                        </tr>

                    </thead>

                    <tbody id="medicineTableBody">

                        <tr>

                            <td colspan="7" class="text-center">
                                Loading medicines...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- MODAL -->
<div
    class="modal fade"
    id="medicineModal"
    tabindex="-1"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content border-0">

            <div class="modal-header bg-primary text-white">

                <h5 class="modal-title">
                    Medicine Form
                </h5>

                <button
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div class="modal-body">

                <form id="medicineForm">

                    <input
                        type="hidden"
                        id="medicineId"
                    >

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Generic Name
                            </label>

                            <input
                                type="text"
                                id="generic_name"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Manufacturer
                            </label>

                            <input
                                type="text"
                                id="manufacturer"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Category
                            </label>

                            <input
                                type="text"
                                id="category"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                SKU
                            </label>

                            <input
                                type="text"
                                id="sku"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Dosage Form
                            </label>

                            <input
                                type="text"
                                id="dosage_form"
                                class="form-control"
                                placeholder="Tablet / Syrup / Injection"
                                required
                            >

                        </div>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Strength
                            </label>

                            <input
                                type="text"
                                id="strength"
                                class="form-control"
                                placeholder="500mg"
                                required
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Storage Type
                            </label>

                            <select
                                id="storage_type"
                                class="form-select"
                                requiredgeneric
                            >

                                <option value="room_temp">
                                    Room Temperature
                                </option>

                                <option value="refrigerated">
                                    Refrigerated
                                </option>

                                <option value="frozen">
                                    Frozen
                                </option>

                                <option value="controlled">
                                    Controlled
                                </option>

                            </select>

                        </div>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Min Stock Threshold
                            </label>

                            <input
                                type="number"
                                id="min_stock_threshold"
                                class="form-control"
                                value="10"
                                required
                            >

                        </div>

                        <div class="col-md-6 mb-3 d-flex align-items-center">

                            <div class="form-check mt-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="is_active"
                                    checked
                                >

                                <label class="form-check-label">
                                    Active Medicine
                                </label>

                            </div>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success w-100"
                    >
                        Save Medicine
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Sidebar -->
<script type="module" src="./js/sidebar.js"></script>

<!-- Medicines JS -->
<script src="./js/medicines.js"></script>

</body>
</html>
