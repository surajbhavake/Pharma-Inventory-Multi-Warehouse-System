<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Audit Logs
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="./css/styles.css"
    >

</head>

<body class="bg-light">


<!-- ===================================================== -->
<!-- SIDEBAR -->
<!-- ===================================================== -->

<div id="sidebar-container"></div>


<!-- ===================================================== -->
<!-- MAIN CONTENT -->
<!-- ===================================================== -->

<div class="main-content p-4">


    <!-- HEADER -->

    <div
        class="d-flex justify-content-between align-items-center mb-4"
    >

        <div>

            <h1 class="fw-bold">
                Audit Logs
            </h1>

            <p
                class="text-muted mb-0"
                id="welcomeText"
            >
                Monitor system activity & compliance
            </p>

        </div>

        <div class="d-flex gap-2">

            <button
                class="btn btn-dark"
                onclick="loadAuditLogs()"
            >

                <i class="bi bi-arrow-clockwise"></i>

                Refresh

            </button>

            <button
                id="logoutBtn"
                class="btn btn-danger"
            >

                Logout

            </button>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- STATS -->
    <!-- ===================================================== -->

    <div class="row g-4 mb-4">

        <div class="col-md-3">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Total Logs
                    </h6>

                    <h2 id="totalLogs">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Create Actions
                    </h6>

                    <h2
                        id="createLogs"
                        class="text-success"
                    >
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Update Actions
                    </h6>

                    <h2
                        id="updateLogs"
                        class="text-warning"
                    >
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Delete Actions
                    </h6>

                    <h2
                        id="deleteLogs"
                        class="text-danger"
                    >
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- FILTERS -->
    <!-- ===================================================== -->

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3">

                <!-- SEARCH -->

                <div class="col-md-4">

                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Search audit logs..."
                    >

                </div>


                <!-- ACTION FILTER -->

                <div class="col-md-3">

                    <select
                        id="actionFilter"
                        class="form-select"
                    >

                        <option value="">
                            All Actions
                        </option>

                        <option value="CREATE">
                            CREATE
                        </option>

                        <option value="UPDATE">
                            UPDATE
                        </option>

                        <option value="DELETE">
                            DELETE
                        </option>

                        <option value="LOGIN">
                            LOGIN
                        </option>

                        <option value="LOGOUT">
                            LOGOUT
                        </option>

                    </select>

                </div>


                <!-- ENTITY FILTER -->

                <div class="col-md-3">

                    <input
                        type="text"
                        id="entityFilter"
                        class="form-control"
                        placeholder="Entity Type..."
                    >

                </div>


                <!-- REFRESH -->

                <div class="col-md-2">

                    <button
                        class="btn btn-primary w-100"
                        onclick="loadAuditLogs()"
                    >

                        Apply

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- AUDIT TABLE -->
    <!-- ===================================================== -->

    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <div
                class="d-flex justify-content-between align-items-center mb-4"
            >

                <h4>

                    System Audit Logs

                </h4>

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>Action</th>

                            <th>User</th>

                            <th>Entity Type</th>

                            <th>Entity ID</th>

                            <th>Description</th>

                            <th>Date</th>

                        </tr>

                    </thead>

                    <tbody id="auditTableBody">

                        <tr>

                            <td colspan="6" class="text-center">

                                Loading audit logs...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- BOOTSTRAP -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<!-- ===================================================== -->
<!-- SIDEBAR -->
<!-- ===================================================== -->

<script
    type="module"
    src="./js/sidebar.js"
></script>


<!-- ===================================================== -->
<!-- AUDIT JS -->
<!-- ===================================================== -->

<script
    src="./js/audit-logs.js"
></script>

</body>
</html>
