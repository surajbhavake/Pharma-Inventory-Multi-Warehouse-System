<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Stock Transfer 
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="./css/styles.css"
    >

</head>

<body class="bg-light">


<!-- ===================================================== -->
<!-- SIDEBAR -->
<!-- ===================================================== -->

<div id="sidebar-container"></div>


<!-- ===================================================== -->
<!-- MAIN CONTENT -->
<!-- ===================================================== -->

<div class="main-content p-4">

    <!-- HEADER -->

    <div
        class="d-flex justify-content-between align-items-center mb-4"
    >

        <div>

            <h1 class="fw-bold">
                Stock Transfer
            </h1>

            <p
                class="text-muted mb-0"
                id="welcomeText"
            >
                Transfer stock between warehouses
            </p>

        </div>

        <button
            id="logoutBtn"
            class="btn btn-danger"
        >

            Logout

        </button>

    </div>


    <!-- ===================================================== -->
    <!-- STATS -->
    <!-- ===================================================== -->

    <div class="row g-4 mb-4">

        <div class="col-md-4">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Total Transfers
                    </h6>

                    <h2 id="transferCount">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Warehouses
                    </h6>

                    <h2 id="warehouseCount">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Active Batches
                    </h6>

                    <h2 id="batchCount">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- TRANSFER FORM -->
    <!-- ===================================================== -->

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <h4 class="mb-4">

                Transfer Stock

            </h4>

            <form id="transferForm">

                <div class="row g-3">

                    <!-- BATCH -->

                    <div class="col-md-3">

                        <label class="form-label">

                            Batch

                        </label>

                        <select
                            id="batchSelect"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Batch
                            </option>

                        </select>

                    </div>


                    <!-- SOURCE -->

                    <div class="col-md-3">

                        <label class="form-label">

                            Source Warehouse

                        </label>

                        <select
                            id="sourceWarehouse"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Source
                            </option>

                        </select>

                    </div>


                    <!-- DESTINATION -->

                    <div class="col-md-3">

                        <label class="form-label">

                            Destination Warehouse

                        </label>

                        <select
                            id="destinationWarehouse"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Destination
                            </option>

                        </select>

                    </div>


                    <!-- QUANTITY -->

                    <div class="col-md-3">

                        <label class="form-label">

                            Quantity

                        </label>

                        <input
                            type="number"
                            id="quantityInput"
                            class="form-control"
                            min="1"
                            required
                        >

                    </div>

                </div>


                <!-- NOTES -->

                <div class="mt-3">

                    <label class="form-label">

                        Transfer Notes

                    </label>

                    <textarea
                        id="notesInput"
                        class="form-control"
                        rows="3"
                        placeholder="Optional notes..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary mt-4"
                >

                    <i class="bi bi-arrow-left-right"></i>

                    Transfer Stock

                </button>

            </form>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- SEARCH -->
    <!-- ===================================================== -->

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-8">

                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Search transfers..."
                    >

                </div>

                <div class="col-md-4">

                    <button
                        class="btn btn-dark w-100"
                        onclick="loadTransfers()"
                    >

                        Refresh

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- TRANSFER HISTORY -->
    <!-- ===================================================== -->

    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <div
                class="d-flex justify-content-between align-items-center mb-4"
            >

                <h4>

                    Transfer History

                </h4>

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>Reference ID</th>

                            <th>Batch</th>

                            <th>Warehouse</th>

                            <th>Movement</th>

                            <th>Quantity</th>

                            <th>User</th>

                            <th>Date</th>

                        </tr>

                    </thead>

                    <tbody id="transferTableBody">

                        <tr>

                            <td colspan="7" class="text-center">

                                Loading transfers...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- SCRIPTS -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script
    type="module"
    src="./js/sidebar.js"
></script>

<script
    src="./js/stock-transfer.js"
></script>

</body>
</html>
