<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Warehouse ERP
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Styles -->
    <link
        rel="stylesheet"
        href="./css/styles.css"
    >

</head>

<body class="bg-light">

<!-- ===================================================== -->
<!-- SIDEBAR -->
<!-- ===================================================== -->

<div id="sidebar-container"></div>


<!-- ===================================================== -->
<!-- MAIN CONTENT -->
<!-- ===================================================== -->

<div class="main-content p-4">

    <!-- HEADER -->

    <div
        class="d-flex justify-content-between align-items-center mb-4"
    >

        <div>

            <h1 class="fw-bold">
                Warehouse 
            </h1>

            <p class="text-muted mb-0">
                Manage warehouse infrastructure
            </p>

        </div>

        <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#warehouseModal"
            onclick="resetForm()"
        >

            <i class="bi bi-plus-circle"></i>

            Add Warehouse

        </button>

    </div>


    <!-- SEARCH -->

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-8">

                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Search warehouse by name, city or code..."
                    >

                </div>

                <div class="col-md-4">

                    <button
                        class="btn btn-dark w-100"
                        onclick="loadWarehouses()"
                    >

                        Refresh

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- TABLE -->

    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>Name</th>

                            <th>Code</th>

                            <th>City</th>

                            <th>State</th>

                            <th>Pincode</th>

                            <th>Phone</th>

                            <th>Manager</th>

                            <th width="200">
                                Actions
                            </th>

                        </tr>

                    </thead>

                    <tbody id="warehouseTableBody">

                        <tr>

                            <td colspan="8" class="text-center">

                                Loading warehouses...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- MODAL -->
<!-- ===================================================== -->

<div
    class="modal fade"
    id="warehouseModal"
    tabindex="-1"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content border-0">

            <div class="modal-header bg-primary text-white">

                <h5 class="modal-title">

                    Warehouse Form

                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div class="modal-body">

                <form id="warehouseForm">

                    <input
                        type="hidden"
                        id="warehouseId"
                    >


                    <!-- NAME + CODE -->

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Warehouse Name

                            </label>

                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Warehouse Code

                            </label>

                            <input
                                type="text"
                                id="code"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>


                    <!-- CITY + STATE -->

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                City

                            </label>

                            <input
                                type="text"
                                id="city"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                State

                            </label>

                            <input
                                type="text"
                                id="state"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>


                    <!-- PINCODE + PHONE -->

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Pincode

                            </label>

                            <input
                                type="text"
                                id="pincode"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Phone Number

                            </label>

                            <input
                                type="text"
                                id="phone"
                                class="form-control"
                                required
                            >

                        </div>

                    </div>


                    <!-- ADDRESS -->

                    <div class="mb-3">

                        <label class="form-label">

                            Full Address

                        </label>

                        <textarea
                            id="address"
                            class="form-control"
                            rows="3"
                            required
                        ></textarea>

                    </div>


                    <!-- MANAGER -->

                    <div class="mb-4">

                        <label class="form-label">

                            Warehouse Manager

                        </label>

                        <select
                            id="manager"
                            class="form-select"
                        >

                            <option value="">
                                Select Manager
                            </option>

                        </select>

                    </div>


                    <!-- SUBMIT -->

                    <button
                        type="submit"
                        class="btn btn-success w-100"
                    >

                        Save Warehouse

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Sidebar -->
<script type="module" src="./js/sidebar.js"></script>

<!-- Warehouse JS -->
<script src="./js/warehouses.js"></script>

</body>
</html>
