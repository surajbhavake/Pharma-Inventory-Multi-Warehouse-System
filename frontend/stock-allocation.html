<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Stock Allocation ERP
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Styles -->
    <link
        rel="stylesheet"
        href="./css/styles.css"
    >

</head>

<body class="bg-light">

<!-- ===================================================== -->
<!-- SIDEBAR -->
<!-- ===================================================== -->

<div id="sidebar-container"></div>


<!-- ===================================================== -->
<!-- MAIN CONTENT -->
<!-- ===================================================== -->

<div class="main-content p-4">

    <!-- HEADER -->

    <div
        class="d-flex justify-content-between align-items-center mb-4"
    >

        <div>

            <h1 class="fw-bold">
                Stock Allocation
            </h1>

            <p
                class="text-muted mb-0"
                id="welcomeText"
            >
                Manage warehouse allocations
            </p>

        </div>

        <button
            id="logoutBtn"
            class="btn btn-danger"
        >

            Logout

        </button>

    </div>


    <!-- ===================================================== -->
    <!-- STATS -->
    <!-- ===================================================== -->

    <div class="row g-4 mb-4">

        <div class="col-md-4">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Total Allocations
                    </h6>

                    <h2 id="allocationCount">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Warehouses
                    </h6>

                    <h2 id="warehouseCount">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Total Stock
                    </h6>

                    <h2 id="stockCount">
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- ALLOCATION FORM -->
    <!-- ===================================================== -->

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <h4 class="mb-4">

                Allocate Stock

            </h4>

            <form id="allocationForm">

                <div class="row g-3">

                    <!-- BATCH -->

                    <div class="col-md-4">

                        <label class="form-label">

                            Batch

                        </label>

                        <select
                            id="batchSelect"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Batch
                            </option>

                        </select>

                    </div>


                    <!-- WAREHOUSE -->

                    <div class="col-md-4">

                        <label class="form-label">

                            Warehouse

                        </label>

                        <select
                            id="warehouseSelect"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Warehouse
                            </option>

                        </select>

                    </div>


                    <!-- QUANTITY -->

                    <div class="col-md-4">

                        <label class="form-label">

                            Quantity

                        </label>

                        <input
                            type="number"
                            id="quantityInput"
                            class="form-control"
                            min="1"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary mt-4"
                >

                    <i class="bi bi-box-seam"></i>

                    Allocate Stock

                </button>

            </form>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- SEARCH -->
    <!-- ===================================================== -->

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-8">

                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Search warehouse or batch..."
                    >

                </div>

                <div class="col-md-4">

                    <button
                        class="btn btn-dark w-100"
                        onclick="loadAllocations()"
                    >

                        Refresh

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- TABLE -->
    <!-- ===================================================== -->

    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <div class="d-flex justify-content-between mb-4">

                <h4>

                    Current Warehouse Stock

                </h4>

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>Warehouse</th>

                            <th>Batch</th>

                            <th>Medicine</th>

                            <th>Quantity</th>

                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody id="allocationTableBody">

                        <tr>

                            <td colspan="5" class="text-center">

                                Loading allocations...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- SCRIPTS -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script
    type="module"
    src="./js/sidebar.js"
></script>

<script
    src="./js/stock-allocation.js"
></script>

</body>
</html>
