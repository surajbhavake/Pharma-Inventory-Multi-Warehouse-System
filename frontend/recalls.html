<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Recall Management ERP
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="./css/styles.css"
    >

</head>

<body class="bg-light">


<!-- ===================================================== -->
<!-- SIDEBAR -->
<!-- ===================================================== -->

<div id="sidebar-container"></div>


<!-- ===================================================== -->
<!-- MAIN CONTENT -->
<!-- ===================================================== -->

<div class="main-content p-4">


    <!-- HEADER -->

    <div
        class="d-flex justify-content-between align-items-center mb-4"
    >

        <div>

            <h1 class="fw-bold">
                Recall Management
            </h1>

            <p
                class="text-muted mb-0"
                id="welcomeText"
            >
                Manage pharmaceutical recalls
            </p>

        </div>

        <div class="d-flex gap-2">

            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#recallModal"
            >

                <i class="bi bi-exclamation-triangle"></i>

                Create Recall

            </button>

            <button
                id="logoutBtn"
                class="btn btn-danger"
            >

                Logout

            </button>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- STATS -->
    <!-- ===================================================== -->

    <div class="row g-4 mb-4">

        <div class="col-md-3">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Total Recalls
                    </h6>

                    <h2 id="totalRecallCount">
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Pending
                    </h6>

                    <h2
                        id="pendingRecallCount"
                        class="text-warning"
                    >
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Approved
                    </h6>

                    <h2
                        id="approvedRecallCount"
                        class="text-success"
                    >
                        0
                    </h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card border-0 shadow-sm">

                <div class="card-body">

                    <h6 class="text-muted">
                        Rejected
                    </h6>

                    <h2
                        id="rejectedRecallCount"
                        class="text-danger"
                    >
                        0
                    </h2>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- SEARCH -->
    <!-- ===================================================== -->

    <div class="card border-0 shadow-sm mb-4">

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-8">

                    <input
                        type="text"
                        id="searchInput"
                        class="form-control"
                        placeholder="Search recalls..."
                    >

                </div>

                <div class="col-md-4">

                    <button
                        class="btn btn-dark w-100"
                        onclick="loadRecalls()"
                    >

                        Refresh

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- TABLE -->
    <!-- ===================================================== -->

    <div class="card border-0 shadow-sm">

        <div class="card-body">

            <div
                class="d-flex justify-content-between align-items-center mb-4"
            >

                <h4>

                    Recall Requests

                </h4>

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>Batch</th>

                            <th>Medicine</th>

                            <th>Reason</th>

                            <th>Status</th>

                            <th>Requested By</th>

                            <th>Date</th>

                            <th>Action</th>

                        </tr>

                    </thead>

                    <tbody id="recallTableBody">

                        <tr>

                            <td colspan="7" class="text-center">

                                Loading recalls...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- CREATE RECALL MODAL -->
<!-- ===================================================== -->

<div
    class="modal fade"
    id="recallModal"
    tabindex="-1"
>

    <div class="modal-dialog">

        <div class="modal-content border-0 shadow">

            <div class="modal-header">

                <h5 class="modal-title">

                    Create Recall Request

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>

            <div class="modal-body">

                <form id="recallForm">

                    <!-- BATCH -->

                    <div class="mb-3">

                        <label class="form-label">

                            Batch

                        </label>

                        <select
                            id="batchSelect"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Batch
                            </option>

                        </select>

                    </div>


                    <!-- REASON -->

                    <div class="mb-3">

                        <label class="form-label">

                            Recall Reason

                        </label>

                        <textarea
                            id="reason"
                            class="form-control"
                            rows="4"
                            placeholder="Enter recall reason..."
                            required
                        ></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success w-100"
                    >

                        <i class="bi bi-send"></i>

                        Submit Recall

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- ===================================================== -->
<!-- SCRIPTS -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script
    type="module"
    src="./js/sidebar.js"
></script>

<script
    src="./js/recalls.js"
></script>

</body>
</html>
