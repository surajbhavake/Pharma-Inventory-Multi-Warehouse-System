<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Pharma ERP Login
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {

            font-family: "Poppins", sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #1e293b,
                    #2563eb
                );

            overflow: hidden;
        }

        .background-circle {

            position: absolute;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.35;
        }

        .circle-1 {

            width: 300px;
            height: 300px;

            background: #3b82f6;

            top: -80px;
            left: -80px;
        }

        .circle-2 {

            width: 350px;
            height: 350px;

            background: #06b6d4;

            bottom: -100px;
            right: -100px;
        }

        .login-wrapper {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

            z-index: 2;
        }

        .login-card {

            width: 100%;
            max-width: 430px;

            background: rgba(255, 255, 255, 0.1);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,0.15);

            border-radius: 24px;

            padding: 40px;

            color: white;

            box-shadow:
                0 10px 40px rgba(0,0,0,0.35);
        }

        .logo-box {

            width: 90px;
            height: 90px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #06b6d4
                );

            border-radius: 20px;

            display: flex;

            justify-content: center;

            align-items: center;

            margin: auto;

            margin-bottom: 20px;

            box-shadow:
                0 10px 25px rgba(37,99,235,0.45);
        }

        .logo-box i {

            font-size: 42px;

            color: white;
        }

        .login-title {

            text-align: center;

            font-size: 32px;

            font-weight: 700;

            margin-bottom: 10px;
        }

        .login-subtitle {

            text-align: center;

            color: rgba(255,255,255,0.75);

            margin-bottom: 35px;
        }

        .form-label {

            font-weight: 500;

            margin-bottom: 8px;
        }

        .input-group-text {

            background: rgba(255,255,255,0.08);

            border: none;

            color: white;
        }

        .form-control {

            background: rgba(255,255,255,0.08);

            border: none;

            color: white;

            padding: 14px;
        }

        .form-control:focus {

            background: rgba(255,255,255,0.12);

            color: white;

            box-shadow:
                0 0 0 0.2rem rgba(37,99,235,0.35);
        }

        .form-control::placeholder {

            color: rgba(255,255,255,0.55);
        }

        .btn-login {

            width: 100%;

            padding: 14px;

            border-radius: 12px;

            border: none;

            font-size: 17px;

            font-weight: 600;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #06b6d4
                );

            transition: 0.3s;
        }

        .btn-login:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 20px rgba(37,99,235,0.35);
        }

        .footer-text {

            text-align: center;

            margin-top: 25px;

            color: rgba(255,255,255,0.6);

            font-size: 14px;
        }

        .erp-badge {

            display: inline-block;

            background: rgba(255,255,255,0.12);

            padding: 8px 18px;

            border-radius: 50px;

            margin-bottom: 20px;

            font-size: 13px;

            font-weight: 600;

            color: #cbd5e1;
        }

    </style>

</head>

<body>


<!-- BACKGROUND EFFECTS -->

<div class="background-circle circle-1"></div>

<div class="background-circle circle-2"></div>


<!-- LOGIN -->

<div class="login-wrapper">

    <div class="login-card">


        <!-- LOGO -->

        <div class="text-center">

            <div class="erp-badge">

                PHARMA INVENTORY ERP

            </div>

        </div>

        <div class="logo-box">

            <i class="bi bi-capsule-pill"></i>

        </div>


        <!-- TITLE -->

        <h1 class="login-title">

            Welcome Back

        </h1>

        <p class="login-subtitle">

            Secure access to your Pharma ERP system

        </p>


        <!-- FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="mb-4">

                <label class="form-label">

                    Email Address

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-envelope-fill"></i>

                    </span>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="admin@pharma.com"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock-fill"></i>

                    </span>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter password"
                        required
                    >

                </div>

            </div>


            <!-- REMEMBER -->

            <div
                class="d-flex justify-content-between align-items-center mb-4"
            >

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="rememberMe"
                    >

                    <label
                        class="form-check-label"
                        for="rememberMe"
                    >

                        Remember me

                    </label>

                </div>

                <a
                    href="#"
                    class="text-info text-decoration-none"
                >

                    Forgot Password?

                </a>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="btn btn-login text-white"
            >

                <i class="bi bi-box-arrow-in-right"></i>

                Login to ERP

            </button>

        </form>


        <!-- FOOTER -->

        <div class="footer-text">

            Pharma Inventory Management System © 2026

        </div>

    </div>

</div>


<!-- LOGIN JS -->

<script
    type="module"
    src="./js/auth.js"
></script>

</body>
</html>
